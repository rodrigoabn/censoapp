[project]
name = "censo-seduct"
version = "0.1.0"
description = "Aplicações de Apoio - Censo Escolar (HUB de aplicações Streamlit)"
readme = "README.md"
# Produção roda em Python 3.14 (uv/devcontainer). O limite <3.15 evita
# que o uv escolha 3.15+, sem wheels para o stack travado (compilaria do fonte).
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Aplicações de Apoio - Censo Escolar" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "streamlit>=1.58.0",
    "playwright==1.61.0",
    "reportlab>=5.0.0",
    "xlrd>=2.0.2",
    "authlib>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
# Lint focado em erros reais (E4/E7/E9/F) + ordenação de imports (I).
# Estilo/formatação ampla fica fora por enquanto, para não gerar ruído.
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E402: imports intencionalmente DEPOIS do shim de sys.path em app.py e nos
# frontends de cadastros/gestor (o shim precisa vir antes).
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "src"]
