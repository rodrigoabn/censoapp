# ---------------------------------------------------------------------------
# HUB na intranet: app Streamlit + proxy reverso Caddy (TLS interno).
# Uso: copie .env.example para .env, ajuste e rode `docker compose up -d`.
# Runbook completo: docs/deploy.md.
# ---------------------------------------------------------------------------
services:
  app:
    build: .
    image: censoapp:latest
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      # vazio = detecção automática ([auth] → oidc; [auth_simples] → senha)
      CENSO_AUTH_MODE: ${CENSO_AUTH_MODE:-}
      CENSO_LOG_DIR: /app/logs
    volumes:
      # crie ./logs antes de subir (docker cria como diretório se não existir)
      - ./logs:/app/logs
      # crie .streamlit/secrets.toml ANTES do primeiro up — o Docker cria um
      # DIRETÓRIO no lugar se o arquivo não existir (ver docs/deploy.md)
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      CENSO_DOMAIN: ${CENSO_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
