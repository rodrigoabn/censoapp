[theme]
base = "dark"

[client]
toolbarMode = "minimal"

[browser]
# Nada de telemetria para data.streamlit.io.
gatherUsageStats = false

[server]
# Servidor local sem interface gráfica: não tenta abrir um navegador no host.
# Para abrir automaticamente em uma estação de trabalho, rode com
# `--server.headless false`.
headless = true
