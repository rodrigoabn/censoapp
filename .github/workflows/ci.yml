name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Produção é Python 3.14 (Dockerfile/devcontainer). Sem isto, o uv
          # escolhe o Python mais novo (3.15+), para o qual o lock não tem
          # wheels, e tenta compilar do fonte — falha.
          python-version: "3.14"

      - name: Instalar dependências (uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Testes
        # Os testes de segurança exigem SECURITY_LIVE=1 e ficam pulados aqui.
        run: uv run python -m pytest -q
